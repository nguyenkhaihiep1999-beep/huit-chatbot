name: HUIT Chatbot CI & Quality Gates

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Repository Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan repository for leaked credentials
        run: python scripts/run_secret_scan.py
      - name: Upload Secret Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: audit_outputs/secret_scan_report.json

  backend:
    name: Backend Compile & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Run backend tests
        run: python -m pytest --junitxml=audit_outputs/backend_pytest_junit.xml
      - name: Upload Backend Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: audit_outputs/backend_pytest_junit.xml

  frontend:
    name: Frontend Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend production bundle
        run: npm run build

  docker-topology-validation:
    name: Docker Topology Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dev and prod Docker Compose topologies
        run: python scripts/validate_docker_compose.py
      - name: Upload Docker Topology Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-validation-report
          path: audit_outputs/docker_compose_validation.json

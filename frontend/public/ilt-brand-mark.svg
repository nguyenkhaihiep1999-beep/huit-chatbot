<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a2215" />
      <stop offset="100%" stop-color="#0f1115" />
    </radialGradient>
    
    <!-- Gold / Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7" />
      <stop offset="35%" stop-color="#d4a359" />
      <stop offset="70%" stop-color="#b37f31" />
      <stop offset="100%" stop-color="#e2b86b" />
    </linearGradient>

    <!-- Warm Radiance Glow -->
    <radialGradient id="lampLight" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#e5a93c" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#d4a359" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Precision Metals -->
    <filter id="metalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Dark Capsule / Shield -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGlow)" stroke="#3e3321" stroke-width="1.5" />
  
  <!-- Subtle Internal Radiance Halo -->
  <circle cx="50%" cy="50%" r="36" fill="url(#lampLight)" />

  <!-- Outer Architectural Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#brassGrad)" stroke-width="1.8" stroke-dasharray="3 1.5" opacity="0.65" />

  <!-- Geometric Luminaire / Modern Pendant & Table Lamp Silhouette -->
  <!-- Top Canopy & Stem -->
  <path d="M50 20 L50 34" stroke="url(#brassGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Architectural Conical Lampshade (Bora / Arno style) -->
  <path d="M34 46 L66 46 L60 34 L40 34 Z" fill="url(#brassGrad)" filter="url(#metalShadow)" />

  <!-- Filament / Light Core Bulb -->
  <circle cx="50" cy="52" r="5.5" fill="#fff9e6" />
  <circle cx="50" cy="52" r="8" fill="none" stroke="#fbd38d" stroke-width="1.5" opacity="0.8" />

  <!-- Radiating Light Beams -->
  <line x1="50" y1="62" x2="50" y2="76" stroke="url(#brassGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="60" x2="33" y2="72" stroke="url(#brassGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="60" x2="67" y2="72" stroke="url(#brassGrad)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Base Disc (for table / floor fixture balance) -->
  <ellipse cx="50" cy="78" rx="14" ry="3" fill="url(#brassGrad)" />
</svg>

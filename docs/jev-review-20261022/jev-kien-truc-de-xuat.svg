<text x="95" y="1709" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">6. KIỂM CHỨNG TRƯỚC KHI MỞ RỘNG ASSIST</text>
<text x="95" y="1755" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#536477" text-anchor="start">Tập câu hỏi có nhãn người duyệt → so sánh off / shadow / assist → đánh giá câu trả lời và nguồn trích dẫn.</text>
<text x="95" y="1797" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Các báo cáo đã đọc dùng mock; chưa đủ kết luận JEV thật cải thiện chất lượng. Ngưỡng cần hiệu chỉnh bằng dữ liệu live.</text>

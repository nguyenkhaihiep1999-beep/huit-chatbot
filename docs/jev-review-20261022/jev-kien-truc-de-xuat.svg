<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1880" viewBox="0 0 2400 1880">
<title>JEV — Kiến trúc cải tiến đề xuất</title>
<desc>Sơ đồ đề xuất dựa trên mã nguồn ngày 22/10/2026; chưa triển khai và chưa đối chiếu ảnh gốc.</desc>
<rect width="2400" height="1880" fill="#f5f7fa"/>
<text x="70" y="86" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#172636" text-anchor="start">JEV / KIẾN TRÚC CẢI TIẾN ĐỀ XUẤT</text>
<text x="70" y="131" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#536477" text-anchor="start">HUIT Chatbot · Kiểm tra mã nguồn 22/10/2026 · Chưa triển khai · Chưa đối chiếu ảnh gốc</text>
<rect x="70" y="158" width="24" height="24" rx="4" fill="#e8f3f8" stroke="#176b91" stroke-width="2" />
<text x="108" y="178" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Khối xanh: phần cần bổ sung hoặc thay đổi</text>
<text x="1520" y="178" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Nét đứt: đo lường ngoài luồng trả lời</text>
<rect x="760" y="220" width="720" height="90" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="785" y="267" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">Câu hỏi + lịch sử hội thoại liên quan</text>
<rect x="760" y="360" width="720" height="100" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="785" y="407" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">Guardrail → Danh mục → Cache</text>
<text x="785" y="445" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Giữ các lối trả lời nhanh đang có</text>
<rect x="1660" y="360" width="650" height="100" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="1685" y="407" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">Trả lời trực tiếp</text>
<text x="1685" y="445" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Guardrail / danh mục / cache có kết quả</text>
<rect x="760" y="520" width="720" height="140" rx="16" fill="#e8f3f8" stroke="#176b91" stroke-width="2" />
<text x="785" y="567" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#176b91" text-anchor="start">1. Chuẩn hóa ngữ cảnh tối thiểu</text>
<text x="785" y="605" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Ngành · năm · phương thức · ý định hiện có</text>
<text x="785" y="639" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Dữ liệu gửi JEV phải được che thông tin riêng tư</text>
<rect x="70" y="520" width="590" height="140" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="95" y="567" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">JEV A / Phân giải ý định</text>
<text x="95" y="605" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Chỉ gọi khi mơ hồ; kiểm tra schema + ngưỡng</text>
<text x="95" y="639" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Giữ baseline nếu lỗi / thiếu độ tin cậy</text>
<rect x="760" y="780" width="720" height="130" rx="16" fill="#e8f3f8" stroke="#176b91" stroke-width="2" />
<text x="785" y="827" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#176b91" text-anchor="start">2. Truy xuất + xếp hạng theo intent</text>
<text x="785" y="865" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Truyền intent đã duyệt vào retrieve / rerank</text>
<text x="785" y="899" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Ràng buộc ngành · năm; giữ tìm kiếm dự phòng</text>
<rect x="70" y="1010" width="590" height="175" rx="16" fill="#e8f3f8" stroke="#176b91" stroke-width="2" />
<text x="95" y="1057" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#176b91" text-anchor="start">3. JEV B / Đánh giá minh chứng</text>
<text x="95" y="1095" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Dùng cùng dữ kiện thực tế sẽ gửi cho LLM</text>
<text x="95" y="1129" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Kèm URL · năm · đoạn chứa câu trả lời</text>
<text x="95" y="1163" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Giới hạn byte sau khi che dữ liệu riêng tư</text>
<rect x="760" y="1000" width="720" height="200" rx="16" fill="#e8f3f8" stroke="#176b91" stroke-width="2" />
<text x="785" y="1047" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#176b91" text-anchor="start">4. Policy quyết định hành động</text>
<text x="785" y="1085" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Đủ → trả lời; một phần → nêu phần còn thiếu</text>
<text x="785" y="1119" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Thiếu chi tiết câu hỏi → hỏi lại cụ thể</text>
<text x="785" y="1153" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Thiếu / xung đột nguồn → thử truy xuất lại</text>
<text x="785" y="1187" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Hết lượt hoặc vẫn thiếu → nêu giới hạn</text>
<rect x="1660" y="1000" width="650" height="100" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="1685" y="1047" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">Hỏi lại hoặc trả lời giới hạn</text>
<text x="1685" y="1085" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Không khẳng định dữ kiện thiếu căn cứ</text>
<rect x="1660" y="1160" width="650" height="140" rx="16" fill="#e8f3f8" stroke="#176b91" stroke-width="2" />
<text x="1685" y="1207" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#176b91" text-anchor="start">Truy xuất bổ sung tối đa 1 lần</text>
<text x="1685" y="1245" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Chỉ khi còn ngân sách request</text>
<text x="1685" y="1279" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Nếu vẫn thiếu → quay về policy</text>
<rect x="760" y="1320" width="720" height="110" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="785" y="1367" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">LLM chính sinh câu trả lời</text>
<text x="785" y="1405" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Chỉ dùng minh chứng được policy cho phép</text>
<rect x="760" y="1490" width="720" height="100" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="785" y="1537" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">NDJSON → giao diện người dùng</text>
<text x="785" y="1575" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Câu trả lời + nguồn trích dẫn</text>
<rect x="1660" y="520" width="650" height="290" rx="16" fill="#e8f3f8" stroke="#176b91" stroke-width="2" />
<text x="1685" y="567" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#176b91" text-anchor="start">5. Shadow qua hàng đợi có giới hạn</text>
<text x="1685" y="605" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Đề xuất: tách khỏi thời gian chờ trả lời</text>
<text x="1685" y="639" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Nhận câu hỏi + evidence của baseline</text>
<text x="1685" y="673" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Lấy mẫu state đã che dữ liệu riêng tư</text>
<text x="1685" y="707" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Worker được quản lý, timeout rõ ràng</text>
<text x="1685" y="741" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Đầy hàng đợi → bỏ mẫu, không chặn chat</text>
<text x="1685" y="775" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Không dùng kết quả để sửa câu trả lời</text>
<rect x="1660" y="1460" width="650" height="130" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="1685" y="1507" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172636" text-anchor="start">Telemetry đã khử thông tin nhạy cảm</text>
<text x="1685" y="1545" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">TTFT · timeout · fallback · quyết định áp dụng</text>
<text x="1685" y="1579" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#536477" text-anchor="start">Chất lượng câu trả lời · token / chi phí</text>
<rect x="70" y="1270" width="590" height="320" rx="16" fill="white" stroke="#cad4de" stroke-width="2" />
<text x="95" y="1317" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172636" text-anchor="start">RÀO CHẮN XUYÊN SUỐT</text>
<text x="95" y="1364" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Sửa cap UTF-8 và evidence_count.</text>
<text x="95" y="1400" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Che dữ liệu trước khi cắt đoạn.</text>
<text x="95" y="1436" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Deadline chung + phần dành cho evidence.</text>
<text x="95" y="1472" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Giữ breaker / giới hạn đồng thời / retry.</text>
<text x="95" y="1508" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Lỗi JEV → baseline hiện có.</text>
<text x="95" y="1544" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#536477" text-anchor="start">Bump policy_version trong cache assist.</text>
